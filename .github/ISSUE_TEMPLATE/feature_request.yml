name: Feature request
description: Propose a focused solver, API, data, or workbench improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What acoustic or engineering workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the API, UI, or solver result you expect.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Accuracy and validation
      description: Explain how the change could be measured or tested.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
