[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-agent"
version = "0.1.0"
description = "Simplified indoor acoustic simulation engine for fast RIR generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "numba>=0.57",
  "h5py>=3.8",
  "shapely>=2.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["acoustic_agent*"]

[tool.setuptools.package-data]
acoustic_agent = [
  "resources/acoustic_materials/*",
  "resources/hrtf/*.sofa",
  "web/*",
]
