[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoustic-agent"
version = "0.1.1"
description = "Indoor acoustic simulation engine and WebGL workbench for geometry, Floorplan, and custom scenes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Acoustic Agent Contributors" },
]
requires-python = ">=3.10"
keywords = [
  "acoustics",
  "room-impulse-response",
  "rir",
  "ray-tracing",
  "hrtf",
  "numba",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23",
  "numba>=0.57",
  "h5py>=3.8",
  "shapely>=2.0",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7",
  "twine>=5",
]

[project.scripts]
acoustic-agent = "acoustic_agent.cli:main"
acoustic-agent-web = "acoustic_agent.web_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["acoustic_agent*"]

[tool.setuptools.package-data]
acoustic_agent = [
  "resources/acoustic_materials/*",
  "resources/hrtf/*.sofa",
  "resources/manifest.json",
  "resources/floorplan/*",
  "resources/benchmark/*",
  "resources/audio/*",
  "web/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
